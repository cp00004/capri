<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Capri</title>
<style>
  :root { --mint: #4dff9d; --pink: #ff4fd8; --red: #ff2b45; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 12px/1.35 "Segoe UI", system-ui, sans-serif; color: #eaf6ff; }

  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 2px 6px 4px;
  }

  #trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  #controls {
    position: relative; z-index: 6;
    display: flex; gap: 5px; height: 22px; align-items: center;
    opacity: .55; transition: opacity .18s ease;
  }
  #controls:hover { opacity: 1; }
  #controls button {
    height: 22px; padding: 0 8px;
    background: rgba(7, 0, 12, .88); color: var(--mint);
    border: 1px solid rgba(77, 255, 157, .5);
    font: 10px/20px system-ui; letter-spacing: 1px; cursor: pointer;
  }
  #controls button:hover { background: rgba(77, 255, 157, .22); color: #b6ffe0; }
  #controls button.on { color: #07000c; background: var(--mint); }
  #controls button.rec { color: #07000c; background: var(--pink); border-color: var(--pink); }
  #mic { min-width: 44px; }

  #stage {
    position: relative;
    z-index: 2;
    margin-top: 1px;
    cursor: grab;
    transform-origin: 50% 62%;
    filter: drop-shadow(0 0 14px rgba(77, 255, 157, .45)) drop-shadow(0 0 34px rgba(255, 79, 216, .22));
    transition: filter .25s ease;
    will-change: transform;
    touch-action: none;
  }
  #stage.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 0 18px rgba(255, 79, 216, .85)) drop-shadow(0 0 40px rgba(77, 255, 157, .5));
  }
  #stage.busy { filter: drop-shadow(0 0 22px rgba(255, 79, 216, .7)); }
  #stage.warp-out { animation: warpOut .16s ease-in forwards; }
  #stage.warp-in { animation: warpIn .3s cubic-bezier(.2,1.4,.3,1); }
  @keyframes warpOut {
    0% { opacity: 1; transform: scale(1); filter: hue-rotate(0deg); }
    45% { opacity: .55; transform: scale(1.06) skewX(7deg); filter: hue-rotate(90deg); }
    100% { opacity: 0; transform: scale(.72) skewX(-12deg); filter: hue-rotate(180deg); }
  }
  @keyframes warpIn {
    0% { opacity: 0; transform: scale(1.35) skewX(14deg); filter: hue-rotate(-120deg); }
    60% { opacity: 1; transform: scale(.97) skewX(-3deg); }
    100% { opacity: 1; transform: scale(1); filter: none; }
  }

  #face { position: relative; will-change: transform; transform-origin: 50% 55%; }
  #eye { display: block; width: 250px; height: auto; }

  /* Socket: the shadowed recess left behind when the iris moves away from the
     printed one. It never moves, so the pupil sliding over it is what reads as
     a glance. */
  #socket {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(circle at 50% 46%, #15000f 0%, #05000a 62%, rgba(5, 0, 10, .55) 88%, rgba(5, 0, 10, 0) 100%);
    box-shadow: inset 0 3px 7px rgba(0, 0, 0, .8), inset 0 -2px 4px rgba(0, 0, 0, .55);
  }

  /* The iris is a real disc cut from her own art and slid over the socket, so
     the pupil travels with it instead of the whole face shifting. */
  #iris {
    position: absolute;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
    will-change: transform;
    filter: saturate(1.18) contrast(1.06);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 82%, rgba(0, 0, 0, 0) 100%);
    mask-image: radial-gradient(circle at 50% 50%, #000 82%, rgba(0, 0, 0, 0) 100%);
  }
  #iris img {
    position: absolute;
    display: block;
    max-width: none;
  }

  /* Fixed catchlight: it stays put while the iris moves under it, which is the
     other half of why an eye reads as a sphere. */
  #glint {
    position: absolute;
    z-index: 4;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle at 38% 36%, rgba(255, 255, 255, .9), rgba(190, 255, 230, .45) 46%, rgba(190, 255, 230, 0) 74%);
    mix-blend-mode: screen;
    opacity: .85;
  }

  #scan {
    position: absolute; left: 8%; right: 8%; height: 16px; top: 20%;
    background: linear-gradient(180deg, transparent 0%, rgba(77,255,157,.32) 50%, transparent 100%);
    animation: scan 3.4s linear infinite;
    mix-blend-mode: screen;
    opacity: .8;
    pointer-events: none;
  }
  @keyframes scan { from { top: 16%; } to { top: 84%; } }

  /* Sits directly under her: a narrow column of text, not a banner across the
     overlay. She talks in short lines, so the box stays small and wraps. */
  #bubble {
    position: relative;
    margin-top: 2px;
    width: fit-content;
    max-width: 162px;
    max-height: 76px; overflow: hidden;
    padding: 3px 6px;
    font-size: 9.5px; line-height: 1.2;
    background: rgba(7, 0, 12, .93);
    border: 1px solid rgba(77, 255, 157, .55);
    border-left: 2px solid var(--pink);
    box-shadow: 0 0 14px rgba(77, 255, 157, .16);
    opacity: 0; translate: 0 -6px;
    transition: opacity .2s ease, translate .2s ease;
    pointer-events: none;
    z-index: 4;
  }
  #bubble.show { opacity: 1; translate: 0 0; }
  #bubble b { display: block; font-size: 7px; letter-spacing: 1.2px; color: var(--mint); margin-bottom: 1px; }
  #bubble b i { font-style: normal; color: var(--pink); }
  #line {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="trail"></canvas>
    <div id="controls">
      <button id="mic" title="Talk to Capri">MIC</button>
      <button id="ear" title="Listen for the wake word">EAR</button>
      <button id="pin" title="Pin in place">PIN</button>
      <button id="close" title="Hide the eye">X</button>
    </div>
    <div id="stage">
      <div id="face">
        <img id="eye" alt="Capri eye" />
        <div id="socket"></div>
        <div id="iris"><img id="irisArt" alt="" /></div>
        <div id="glint"></div>
      </div>
      <div id="scan"></div>
    </div>
    <div id="bubble"><b>CAPRI // EYE <i id="mode"></i></b><span id="line"></span></div>
  </div>

<script>
  const wrap = document.getElementById("wrap");
  const stage = document.getElementById("stage");
  const face = document.getElementById("face");
  const img = document.getElementById("eye");
  const socket = document.getElementById("socket");
  const iris = document.getElementById("iris");
  const irisArt = document.getElementById("irisArt");
  const glint = document.getElementById("glint");
  const bubble = document.getElementById("bubble");
  const line = document.getElementById("line");
  const modeTag = document.getElementById("mode");
  const pin = document.getElementById("pin");
  const close = document.getElementById("close");
  const mic = document.getElementById("mic");
  const ear = document.getElementById("ear");
  const canvas = document.getElementById("trail");
  const ctx = canvas.getContext("2d");

  const wakeOn = { on: true };
  const cfg = { base: "", token: "", session: "" };
  const state = { locked: false, bubbleTimer: null, askTimer: null, live: true, dragging: false };

  /* ---------------------------------------------------------- eye cutout */

  const sprite = { image: null, w: 250, h: 160, pink: null, mint: null, red: null, green: null, dark: null };
  // Measured off the cutout: the iris disc centre and radius as fractions of
  // the art box. Detection of "blue pixels" caught the blue shadows in the
  // lashes too, which is why the aperture used to grow into a black disc.
  const ball = { cx: 0.4817, cy: 0.621, r: 0.0978, size: 49, left: 0, top: 0, max: 5 };
  // Alpha silhouette of the cut art: clicks only count where she is drawn.
  let mask = null;

  // The art came on a white card. Fade every near-white pixel out and trim the
  // empty border, so only the eye is left floating.
  function cutWhite(image) {
    const scale = Math.min(1, 760 / image.naturalWidth);
    const w = Math.max(1, Math.round(image.naturalWidth * scale));
    const h = Math.max(1, Math.round(image.naturalHeight * scale));
    const work = document.createElement("canvas");
    work.width = w;
    work.height = h;
    const c = work.getContext("2d");
    c.drawImage(image, 0, 0, w, h);
    const frame = c.getImageData(0, 0, w, h);
    const px = frame.data;
    for (let i = 0; i < px.length; i += 4) {
      const low = Math.min(px[i], px[i + 1], px[i + 2]);
      const t = Math.min(1, Math.max(0, (low - 150) / 45));
      if (t > 0) px[i + 3] = Math.round(px[i + 3] * (1 - t));
    }
    c.putImageData(frame, 0, 0);

    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (px[(y * w + x) * 4 + 3] > 12) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    const pad = 4;
    let cut = work;
    if (x1 >= x0 && y1 >= y0) {
      x0 = Math.max(0, x0 - pad);
      y0 = Math.max(0, y0 - pad);
      x1 = Math.min(w - 1, x1 + pad);
      y1 = Math.min(h - 1, y1 + pad);
      cut = document.createElement("canvas");
      cut.width = x1 - x0 + 1;
      cut.height = y1 - y0 + 1;
      cut.getContext("2d").drawImage(work, x0, y0, cut.width, cut.height, 0, 0, cut.width, cut.height);
    }

    img.dataset.src = cut.toDataURL("image/png");
    img.src = img.dataset.src;
    sprite.image = img;
    mask = { w: cut.width, h: cut.height, data: cut.getContext("2d").getImageData(0, 0, cut.width, cut.height).data };
    buildEyeball();
    sprite.pink = tint(cut, "#ff4fd8");
    sprite.mint = tint(cut, "#4dff9d");
    sprite.red = tint(cut, "#ff2b45");
    sprite.green = tint(cut, "#31ff8a");
    sprite.dark = tint(cut, "#05000a");
  }

  function tint(source, color) {
    const out = document.createElement("canvas");
    out.width = source.width;
    out.height = source.height;
    const c = out.getContext("2d");
    c.drawImage(source, 0, 0);
    c.globalCompositeOperation = "source-in";
    c.fillStyle = color;
    c.fillRect(0, 0, out.width, out.height);
    return out;
  }

  // The iris layer is the same cutout parked over itself inside a soft circle.
  // Sliding that layer a few pixels is what makes the eyeball look around.
  function buildEyeball() {
    irisArt.src = img.dataset.src || img.src;
    layoutEyeball();
  }

  function layoutEyeball() {
    const rect = img.getBoundingClientRect();
    const shownW = rect.width || sprite.w;
    const shownH = rect.height || Math.round(shownW * (sprite.h / sprite.w));
    const disc = Math.round(ball.r * 2 * shownW);
    const cx = ball.cx * shownW;
    const cy = ball.cy * shownH;
    ball.size = disc;
    ball.left = cx - disc / 2;
    ball.top = cy - disc / 2;
    // A glance of a fifth of the iris diameter. Large enough to read at a
    // glance, small enough that the disc never climbs onto the lashes.
    ball.max = Math.max(6.5, disc * 0.21);

    for (const node of [socket, iris]) {
      node.style.width = `${disc}px`;
      node.style.height = `${disc}px`;
      node.style.left = `${ball.left.toFixed(1)}px`;
      node.style.top = `${ball.top.toFixed(1)}px`;
    }
    irisArt.style.width = `${shownW}px`;
    irisArt.style.height = `${shownH}px`;
    irisArt.style.left = `${(-ball.left).toFixed(1)}px`;
    irisArt.style.top = `${(-ball.top).toFixed(1)}px`;

    const g = Math.round(disc * 0.26);
    glint.style.width = `${g}px`;
    glint.style.height = `${g}px`;
    glint.style.left = `${(cx - g * 0.62).toFixed(1)}px`;
    glint.style.top = `${(cy - g * 0.72).toFixed(1)}px`;
  }

  img.addEventListener("load", () => {
    sprite.w = 250;
    sprite.h = Math.max(1, Math.round(250 * img.naturalHeight / img.naturalWidth));
    sprite.image = img;
    if (!img.dataset.done) {
      img.dataset.done = "1";
      cutWhite(img);
    } else {
      layoutEyeball();
    }
  });
  img.src = "../public/assets/eye-spy.png";

  /* ------------------------------------------------------ clickable outline */

  // Real alpha test: sample the cut art (dilated a couple of source pixels) so
  // the window's empty margin is invisible to the mouse instead of swallowing
  // whatever the user is doing behind her.
  function alphaAt(u, v) {
    if (!mask) return true;
    const x = Math.round(u * (mask.w - 1));
    const y = Math.round(v * (mask.h - 1));
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const px = x + dx;
        const py = y + dy;
        if (px < 0 || py < 0 || px >= mask.w || py >= mask.h) continue;
        if (mask.data[(py * mask.w + px) * 4 + 3] > 24) return true;
      }
    }
    return false;
  }

  function interactiveAt(clientX, clientY) {
    const hit = document.elementFromPoint(clientX, clientY);
    if (hit && hit.closest && hit.closest("#controls")) return true;
    const rect = stage.getBoundingClientRect();
    if (!rect.width || !rect.height) return false;
    if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return false;
    return alphaAt((clientX - rect.left) / rect.width, (clientY - rect.top) / rect.height);
  }

  let ignoring = true;
  function setIgnore(next) {
    if (next === ignoring) return;
    ignoring = next;
    try { window.capriEye?.clickThrough(next); } catch { /* older shell */ }
  }

  function refreshHit(clientX, clientY) {
    if (drag.on) { setIgnore(false); return; }
    const inside = clientX >= 0 && clientY >= 0 && clientX <= window.innerWidth && clientY <= window.innerHeight;
    setIgnore(!inside || !interactiveAt(clientX, clientY));
  }

  window.addEventListener("mousemove", (event) => refreshHit(event.clientX, event.clientY), { passive: true });
  window.addEventListener("mouseleave", () => { if (!drag.on) setIgnore(true); });
  window.addEventListener("blur", () => { if (!drag.on) setIgnore(true); });
  setIgnore(true);

  /* ------------------------------------------------------ self-movement */

  // The whole eye drifts on its own; the eyeball inside it aims at the cursor.
  const gaze = { x: 0, y: 0, rot: 0, tx: 0, ty: 0, trot: 0, next: 0 };
  const look = { x: 0, y: 0, tx: 0, ty: 0, next: 0 };
  const impulse = { x: 0, y: 0 };
  let lastImpulse = { x: 0, y: 0 };
  let cursor = null;
  let lastCursorAt = 0;
  const ghosts = [];
  const shards = [];
  let lastStamp = { x: 0, y: 0, rot: 0 };
  let ghostColor = 0;
  let warping = false;

  function newGazeTarget() {
    const spread = Math.random() > 0.85 ? 12 : 7;
    gaze.tx = (Math.random() * 2 - 1) * spread;
    gaze.ty = (Math.random() * 2 - 1) * 5;
    gaze.trot = (Math.random() * 2 - 1) * 2.6;
    gaze.next = performance.now() + 2200 + Math.random() * 3000;
  }
  function newLookTarget() {
    // Bias toward the sides and below: those are the glances people actually
    // notice, and they used to be the ones that read as "blank stare".
    const angle = Math.random() * Math.PI * 2;
    look.tx = Math.cos(angle) * ball.max;
    look.ty = Math.sin(angle) * ball.max * 0.95;
    look.next = performance.now() + 1100 + Math.random() * 2000;
  }
  newGazeTarget();
  newLookTarget();

  function stageBox() { return stage.getBoundingClientRect(); }

  const SHARD_COLORS = ["#ff2b45", "#05000a", "#31ff8a", "#ff4fd8", "#4dff9d"];

  function spawnShards(count, spread = 1) {
    const box = stageBox();
    for (let i = 0; i < count; i++) {
      shards.push({
        x: box.left + Math.random() * box.width,
        y: box.top + Math.random() * box.height,
        vx: (Math.random() * 2 - 1) * 1.8 * spread,
        vy: (Math.random() - 1.3) * 1.6 * spread,
        life: 1,
        w: 2 + Math.random() * 6,
        h: 1 + Math.random() * 3,
        color: SHARD_COLORS[(Math.random() * SHARD_COLORS.length) | 0],
      });
    }
    if (shards.length > 220) shards.splice(0, shards.length - 220);
  }

  function frame(now) {
    const box = stageBox();
    const cx = window.innerWidth / 2;
    const cy = box.top + box.height / 2;

    if (now > gaze.next) newGazeTarget();

    let tx = gaze.tx;
    let ty = gaze.ty;
    let trot = gaze.trot;

    // Lean the whole eye toward the cursor when it is moving around this window.
    if (cursor && now - lastCursorAt < 2600 && !state.locked) {
      const dx = Math.max(-1, Math.min(1, (cursor.x - cx) / (box.width * 1.4)));
      const dy = Math.max(-1, Math.min(1, (cursor.y - cy) / (box.height * 7)));
      tx = tx * 0.35 + dx * 10;
      ty = ty * 0.35 + dy * 5;
      trot = trot * 0.4 + dx * 2;
    }

    gaze.x += (tx - gaze.x) * 0.055;
    gaze.y += (ty - gaze.y) * 0.055;
    gaze.rot += (trot - gaze.rot) * 0.06;

    impulse.x *= 0.9;
    impulse.y *= 0.9;

    // A slow lissajous drift: she visibly floats up, down and around instead of
    // sitting still between gaze targets. Dragging pins her to the cursor.
    // Kept tighter than the iris travel so the glance stays the loudest motion.
    const drift = state.dragging ? 0.2 : 1;
    const driftX = (Math.sin(now * 0.00092) * 5 + Math.sin(now * 0.00041 + 1.7) * 2.5) * drift;
    const driftY = (Math.cos(now * 0.00113) * 6 + Math.cos(now * 0.00037 + 0.9) * 3) * drift;

    const px = gaze.x + impulse.x + driftX;
    const py = gaze.y + impulse.y + driftY;
    // Speed stretches her along the motion and leans her into the turn.
    const speed = Math.min(1, Math.hypot(impulse.x - lastImpulse.x, impulse.y - lastImpulse.y) * 0.12);
    const sx = 1 + speed * 0.1;
    const sy = 1 - speed * 0.09;
    lastImpulse = { x: impulse.x, y: impulse.y };
    stage.style.transform =
      `translate(${px.toFixed(2)}px, ${py.toFixed(2)}px) rotate(${(gaze.rot + impulse.x * 0.06).toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;

    /* ---- eyeball: follow the cursor, wander when it is far away ---- */
    const irisLeft = box.left + ball.left + px + ball.size / 2;
    const irisTop = box.top + ball.top + py + ball.size / 2;
    if (cursor && now - lastCursorAt < 4000) {
      const dx = cursor.x - irisLeft;
      const dy = cursor.y - irisTop;
      const dist = Math.hypot(dx, dy);
      if (dist > ball.size * 0.55) {
        look.tx = (dx / dist) * ball.max;
        look.ty = (dy / dist) * ball.max * 0.95;
      } else {
        look.tx = (dx / ball.size) * ball.max;
        look.ty = (dy / ball.size) * ball.max;
      }
      look.next = now + 900;
    } else if (now > look.next) {
      newLookTarget();
    }
    look.x += (look.tx - look.x) * 0.12;
    look.y += (look.ty - look.y) * 0.12;
    iris.style.transform = `translate(${look.x.toFixed(2)}px, ${look.y.toFixed(2)}px)`;

    const ox = cx + px;
    const oy = cy + py;
    const step = state.dragging ? 1.2 : 1.2;
    const seam = state.dragging ? 22 : 11;
    // While dragging, stamp every frame: the window follows the cursor, so the
    // art itself barely shifts and distance alone would keep the trail invisible.
    if (state.dragging || Math.hypot(ox - lastStamp.x, oy - lastStamp.y) > step) {
      ghosts.push({
        x: ox,
        y: oy,
        rot: gaze.rot,
        life: 1,
        color: state.dragging ? (ghostColor++ % 2 ? "pink" : "mint") : "",
        glitch: Boolean(state.dragging),
      });
      if (ghosts.length > seam) ghosts.shift();
      lastStamp = { x: ox, y: oy };
      if (state.dragging) {
        spawnShards(2, 1.0);
        if (shards.length > 120) shards.splice(0, shards.length - 120);
      }
    }

    drawTrail(now);
    requestAnimationFrame(frame);
  }

  function drawTrail() {
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(window.innerWidth * dpr)) {
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!sprite.image || !sprite.image.complete || !sprite.image.naturalWidth) return;
    if (!sprite.w) return;

    const artFor = (g) => g.color === "pink" ? sprite.pink : g.color === "mint" ? sprite.mint : sprite.image;

    for (let i = ghosts.length - 1; i >= 0; i--) {
      const g = ghosts[i];
      g.life *= g.color ? 0.9 : 0.86;
      if (g.life < 0.06) { ghosts.splice(i, 1); continue; }
      const art = artFor(g);
      if (!art) continue;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate((g.rot * Math.PI) / 180);
      if (g.glitch) {
        // RGB split: red and green copies pulled apart, a dead-black core in
        // between, so a drag reads as a corrupted frame and not a smear.
        const off = 2.6 + (1 - g.life) * 8;
        ctx.globalAlpha = 0.3 * g.life * g.life;
        if (sprite.red) ctx.drawImage(sprite.red, -sprite.w / 2 - off, -sprite.h / 2, sprite.w, sprite.h);
        if (sprite.green) ctx.drawImage(sprite.green, -sprite.w / 2 + off, -sprite.h / 2, sprite.w, sprite.h);
        ctx.globalAlpha = 0.5 * g.life * g.life;
        if (sprite.dark) ctx.drawImage(sprite.dark, -sprite.w / 2, -sprite.h / 2, sprite.w, sprite.h);
      } else {
        ctx.globalAlpha = (g.color ? 0.34 : 0.13) * g.life * g.life;
      }
      ctx.drawImage(art, -sprite.w / 2, -sprite.h / 2, sprite.w, sprite.h);
      ctx.restore();
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i];
      s.life -= 0.035;
      if (s.life <= 0) { shards.splice(i, 1); continue; }
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.06;
      ctx.globalAlpha = Math.min(1, s.life) * 0.9;
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, s.w, s.h);
    }
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);

  // Forwarded mousemove events do not arrive while the window ignores the mouse,
  // so the global cursor feed from main is also the hit tester: it can flip the
  // window back to clickable the moment the pointer crosses the art edge.
  window.capriEye?.onCursor((point) => {
    cursor = point;
    lastCursorAt = performance.now();
    refreshHit(point.x, point.y);
  });

  // Dragging leaves the eye behind for a frame, which reads as a streak.
  window.capriEye?.onMove(({ dx, dy }) => {
    if (!dx && !dy) return;
    const k = state.dragging ? 0.9 : 0.55;
    const capX = state.dragging ? 30 : 26;
    const capY = state.dragging ? 24 : 18;
    impulse.x = Math.max(-capX, Math.min(capX, impulse.x - dx * k));
    impulse.y = Math.max(-capY, Math.min(capY, impulse.y - dy * k));
  });

  /* ------------------------------------------------------------- drag */

  // The window is moved from here in screen coordinates. Native drag regions
  // were swallowing the mouse: they cannot coexist with the per-frame transforms
  // on the stage, and they made the controls unclickable.
  const drag = { on: false, lx: 0, ly: 0, moved: 0, id: null, at: 0 };

  function endDrag() {
    if (!drag.on) return;
    drag.on = false;
    state.dragging = false;
    stage.classList.remove("dragging");
    if (drag.id !== null) { try { stage.releasePointerCapture(drag.id); } catch { /* gone */ } }
    drag.id = null;
    window.capriEye?.dragEnd();
    const tapped = drag.moved < 7 && performance.now() - drag.at < 340;
    if (drag.moved < 6) setMode("");
    if (tapped) teleport();
  }

  function beginDrag(event) {
    if (event.button !== 0 && event.pointerType !== "touch") return;
    const hit = document.elementFromPoint(event.clientX, event.clientY);
    if (hit && hit.closest && (hit.closest("button") || hit.closest("#controls"))) return;
    if (!interactiveAt(event.clientX, event.clientY)) return;
    if (drag.on) endDrag();
    drag.on = true;
    drag.lx = event.screenX;
    drag.ly = event.screenY;
    drag.moved = 0;
    drag.id = event.pointerId;
    drag.at = performance.now();
    state.dragging = true;
    stage.classList.add("dragging");
    setIgnore(false);
    setMode("hold");
    try { stage.setPointerCapture(event.pointerId); } catch { /* not capturable */ }
    event.preventDefault();
  }

  function moveDrag(event) {
    if (!drag.on) return;
    // A released button with capture lost still lands here: end instead of
    // letting the eye follow the cursor forever.
    if (event.pointerType === "mouse" && event.buttons === 0) { endDrag(); return; }
    const dx = event.screenX - drag.lx;
    const dy = event.screenY - drag.ly;
    if (!dx && !dy) return;
    drag.lx = event.screenX;
    drag.ly = event.screenY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    window.capriEye?.drag(dx, dy);
  }

  window.addEventListener("pointerdown", beginDrag, true);
  window.addEventListener("pointermove", moveDrag, true);
  window.addEventListener("pointerup", endDrag, true);
  window.addEventListener("pointercancel", endDrag, true);
  window.addEventListener("lostpointercapture", endDrag, true);
  window.addEventListener("mouseup", endDrag, true);

  /* --------------------------------------------------------- teleport */

  function teleport() {
    if (warping || !state.live) return;
    warping = true;
    spawnShards(30, 1.8);
    stage.classList.add("warp-out");
    setTimeout(() => {
      try { window.capriEye?.teleport(); } catch { /* older shell */ }
      ghosts.length = 0;
      shards.length = 0;
      stage.classList.remove("warp-out");
      stage.classList.add("warp-in");
      setTimeout(() => stage.classList.remove("warp-in"), 340);
      warping = false;
    }, 150);
  }

  // She moves on her own now and then, always leaving a glitch behind.
  (function scheduleWarp() {
    setTimeout(() => {
      if (state.live && !state.dragging && !warping && !state.locked && !bubble.classList.contains("show")) teleport();
      scheduleWarp();
    }, 75_000 + Math.random() * 85_000);
  })();

  /* ------------------------------------------------------------- blink */

  function blink() {
    face.animate(
      [{ transform: "scaleY(1)" }, { transform: "scaleY(0.08)" }, { transform: "scaleY(1)" }],
      { duration: 190, easing: "ease-in-out" }
    );
  }
  (function scheduleBlink() {
    setTimeout(() => { blink(); if (Math.random() > 0.7) setTimeout(blink, 240); scheduleBlink(); }, 3200 + Math.random() * 5200);
  })();

  /* ------------------------------------------------------------- speech */

  function setMode(text) { modeTag.textContent = text ? `// ${text}` : ""; }

  window.capriEye?.onSay(({ text }) => {
    if (!text) { bubble.classList.remove("show"); return; }
    line.textContent = text;
    bubble.classList.add("show");
    stage.classList.add("busy");
    setMode("");
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => {
      bubble.classList.remove("show");
      stage.classList.remove("busy");
    }, 11000);
  });

  window.capriEye?.onConfig((data) => {
    Object.assign(cfg, data || {});
    if (!cfg.base) cfg.base = location.origin === "null" ? "" : location.origin;
    if (state.live && wakeOn.on) wakeRec.on ? null : startWake();
  });

  // Hidden eye means no mic: stop listening the moment the overlay goes away.
  window.capriEye?.onLive((live) => {
    state.live = Boolean(live);
    if (!state.live) {
      shutdownWake();
      if (talk.active) stopTalk();
    } else {
      ghosts.length = 0;
      shards.length = 0;
      lastStamp = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      if (wakeOn.on) setTimeout(startWake, 400);
    }
  });

  window.capriEye?.onPinned((locked) => {
    state.locked = Boolean(locked);
    pin.classList.toggle("on", state.locked);
    pin.textContent = state.locked ? "PINNED" : "PIN";
  });

  pin.addEventListener("click", () => window.capriEye?.setPinned(!state.locked));
  close.addEventListener("click", () => window.capriEye?.hide());

  /* -------------------------------------------------------------- voice */

  const MIMES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  function pickMime() {
    if (typeof MediaRecorder === "undefined") return "";
    return MIMES.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  }

  const talk = { active: false, chunks: [], recorder: null, stream: null, stopTimer: null, heard: false, ctx: null, analyser: null, raf: null, silenceSince: 0, startedAt: 0 };
  const wakeRec = { on: false, chunks: [], recorder: null, stream: null, busy: false, ctx: null, analyser: null, raf: 0, speaking: false, startedAt: 0, quietAt: 0, cooldown: 0 };

  // One context for the eye, resumed the moment it is made: a parked context
  // hands the analyser flat silence, which reads as a room that never speaks.
  let eyeCtx = null;
  function eyeAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!eyeCtx || eyeCtx.state === "closed") eyeCtx = new Ctx();
    if (eyeCtx.state === "suspended") eyeCtx.resume().catch(() => {});
    return eyeCtx;
  }

  function micApi() {
    return `${cfg.base || ""}/api`;
  }

  async function ask(text) {
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    if (!clean) return;
    setMode("heard");
    line.textContent = clean;
    bubble.classList.add("show");
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 8000);
    window.capriEye?.ask(clean);
    stage.classList.add("busy");
    clearTimeout(state.askTimer);
    state.askTimer = setTimeout(() => { stage.classList.remove("busy"); setMode(""); }, 25000);
  }

  async function transcribe(blob) {
    if (!cfg.base) { setMode("no link"); return ""; }
    const headers = { "Content-Type": blob.type || "audio/webm" };
    if (cfg.token) headers.Authorization = `Bearer ${cfg.token}`;
    if (cfg.session) headers["X-Capri-Profile"] = cfg.session;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await fetch(`${micApi()}/stt`, { method: "POST", headers, body: blob });
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          const text = String(data.text || "").trim();
          if (text) return text;
        } else if (res.status < 500 && res.status !== 429) {
          break;
        }
      } catch { /* retry once */ }
      await new Promise((r) => setTimeout(r, 240));
    }
    return "";
  }

  function watchSilence() {
    if (!talk.active || !talk.analyser) return;
    const buf = new Uint8Array(talk.analyser.fftSize);
    const loop = () => {
      if (!talk.active || !talk.analyser) return;
      talk.analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      const now = performance.now();
      if (rms > 0.02) { talk.heard = true; talk.silenceSince = now; }
      // Stop by herself once the sentence is over, so a tap-and-talk feels live.
      if (talk.heard && now - talk.silenceSince > 1500) { stopTalk(); return; }
      if (!talk.heard && now - talk.startedAt > 9000) { stopTalk(); return; }
      talk.raf = requestAnimationFrame(loop);
    };
    talk.raf = requestAnimationFrame(loop);
  }

  async function startTalk() {
    if (talk.active) return stopTalk();
    if (typeof MediaRecorder === "undefined") { setMode("no mic"); return; }
    shutdownWake();
    try {
      talk.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch {
      setMode("mic blocked");
      return;
    }
    const mime = pickMime();
    talk.chunks = [];
    talk.recorder = mime ? new MediaRecorder(talk.stream, { mimeType: mime }) : new MediaRecorder(talk.stream);
    talk.recorder.ondataavailable = (e) => { if (e.data && e.data.size) talk.chunks.push(e.data); };
    talk.recorder.onstop = async () => {
      const blob = new Blob(talk.chunks, { type: talk.recorder.mimeType || "audio/webm" });
      talk.stream?.getTracks().forEach((t) => t.stop());
      talk.stream = null;
      talk.active = false;
      mic.classList.remove("rec");
      mic.textContent = "MIC";
      setMode("");
      if (blob.size < 900) { setMode("too short"); setTimeout(() => setMode(""), 2200); resumeWake(); return; }
      setMode("thinking");
      const text = await transcribe(blob);
      if (!text) { setMode("didn't catch that"); setTimeout(() => setMode(""), 3200); resumeWake(); return; }
      ask(text);
      resumeWake();
    };
    talk.recorder.start(120);
    talk.active = true;
    talk.startedAt = performance.now();
    talk.silenceSince = talk.startedAt;
    talk.heard = false;
    mic.classList.add("rec");
    mic.textContent = "STOP";
    setMode("listening");
    try {
      talk.ctx = eyeAudioCtx();
      const src = talk.ctx.createMediaStreamSource(talk.stream);
      talk.analyser = talk.ctx.createAnalyser();
      talk.analyser.fftSize = 512;
      src.connect(talk.analyser);
      watchSilence();
    } catch { /* silence watch is optional */ }
    clearTimeout(talk.stopTimer);
    talk.stopTimer = setTimeout(() => stopTalk(), 18000);
  }

  function stopTalk() {
    clearTimeout(talk.stopTimer);
    cancelAnimationFrame(talk.raf);
    talk.raf = null;
    talk.analyser = null;
    talk.ctx = null;
    if (!talk.active || !talk.recorder || talk.recorder.state === "inactive") return;
    try { talk.recorder.stop(); } catch { /* already stopped */ }
  }

  mic.addEventListener("click", startTalk);

  /* Wake word: recorded in short clips while the eye is up, read by her own
     /api/stt, so "Capri ..." works even when Capri's window is away. */
  /* Wake word: one mic held open and cut into clips by her own voice gate, so
     there is no deaf stretch between "Capri" and the order, and no fixed window
     that swallows the first syllable. Only a clip with sound in it goes to STT. */
  const WAKE_RMS = 0.02;

  function wakeRms() {
    if (!wakeRec.analyser) return 1; // no meter: treat the room as talking
    const buf = new Uint8Array(wakeRec.analyser.fftSize);
    wakeRec.analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i += 1) { const v = (buf[i] - 128) / 128; sum += v * v; }
    return Math.sqrt(sum / buf.length);
  }

  async function startWake() {
    if (!wakeOn.on || wakeRec.on || talk.active || !state.live) return;
    if (typeof MediaRecorder === "undefined" || !cfg.base) return;
    if (!wakeRec.stream) {
      try {
        wakeRec.stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
      } catch {
        wakeOn.on = false;
        ear.classList.remove("on");
        setMode("mic blocked");
        return;
      }
      try {
        wakeRec.ctx = eyeAudioCtx();
        const src = wakeRec.ctx.createMediaStreamSource(wakeRec.stream);
        wakeRec.analyser = wakeRec.ctx.createAnalyser();
        wakeRec.analyser.fftSize = 512;
        src.connect(wakeRec.analyser);
      } catch { wakeRec.analyser = null; }
    }
    wakeRec.on = true;
    wakeRec.cooldown = 0;
    ear.classList.add("on");
    setMode("ear on");
    cancelAnimationFrame(wakeRec.raf);
    wakeRec.raf = requestAnimationFrame(wakeLoop);
  }

  function wakeLoop() {
    if (!wakeRec.on) return;
    wakeRec.raf = requestAnimationFrame(wakeLoop);
    // Her own voice, or a tap-to-talk take, owns the mic.
    if (talk.active || wakeRec.busy) { if (wakeRec.speaking) stopWakeChunk(); return; }
    const rms = wakeRms();
    const now = performance.now();
    if (!wakeRec.speaking) {
      if (rms > WAKE_RMS && now > wakeRec.cooldown) beginWakeChunk();
      return;
    }
    if (rms > WAKE_RMS) wakeRec.quietAt = now;
    const length = now - wakeRec.startedAt;
    if (length > 400 && now - wakeRec.quietAt > 480) return stopWakeChunk();
    if (length > 3500) return stopWakeChunk();
  }

  function beginWakeChunk() {
    if (!wakeRec.stream) return;
    const mime = pickMime();
    let rec;
    try {
      rec = mime ? new MediaRecorder(wakeRec.stream, { mimeType: mime }) : new MediaRecorder(wakeRec.stream);
    } catch { wakeRec.cooldown = performance.now() + 1200; return; }
    wakeRec.chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) wakeRec.chunks.push(e.data); };
    rec.onstop = onWakeChunk;
    wakeRec.recorder = rec;
    wakeRec.speaking = true;
    wakeRec.startedAt = performance.now();
    wakeRec.quietAt = wakeRec.startedAt;
    try {
      rec.start(120);
    } catch {
      wakeRec.speaking = false;
      wakeRec.recorder = null;
      wakeRec.cooldown = performance.now() + 1200;
    }
  }

  function stopWakeChunk() {
    wakeRec.speaking = false;
    const rec = wakeRec.recorder;
    if (!rec || rec.state === "inactive") return;
    try { rec.stop(); } catch { /* already stopped */ }
  }

  // A clip thrown away on purpose: the mic is handing over to a real take.
  function dropWakeChunk() {
    const rec = wakeRec.recorder;
    wakeRec.recorder = null;
    wakeRec.chunks = [];
    if (rec && rec.state !== "inactive") {
      rec.onstop = null;
      try { rec.stop(); } catch { /* already stopped */ }
    }
  }

  async function onWakeChunk() {
    const mime = wakeRec.recorder?.mimeType || "audio/webm";
    wakeRec.recorder = null;
    const blob = new Blob(wakeRec.chunks, { type: mime });
    wakeRec.chunks = [];
    wakeRec.cooldown = performance.now() + 350;
    if (blob.size < 1200) return;
    wakeRec.busy = true; // stand down while she reads it
    const text = await transcribe(blob);
    wakeRec.busy = false;
    if (!wakeRec.on || talk.active) return;
    if (text && isWakePhrase(text)) {
      const rest = wakeRemainder(text);
      chime();
      if (rest.split(/\s+/).filter(Boolean).length >= 2) { ask(rest); return; }
      // Ping first, then hand the mic to the order it just invited.
      endWake();
      setTimeout(startTalk, 160);
      return;
    }
    if (!talk.active && wakeOn.on && state.live) wakeRec.cooldown = performance.now() + 200;
  }

  function endWake() {
    wakeRec.on = false;
    wakeRec.busy = false;
    cancelAnimationFrame(wakeRec.raf);
    wakeRec.raf = 0;
    dropWakeChunk();
  }

  function shutdownWake() {
    endWake();
    wakeRec.stream?.getTracks().forEach((t) => t.stop());
    wakeRec.stream = null;
    wakeRec.analyser = null;
    ear.classList.remove("on");
  }

  function resumeWake() {
    if (wakeOn.on && !talk.active && !wakeRec.on) setTimeout(startWake, 400);
  }

  ear.addEventListener("click", () => {
    wakeOn.on = !wakeOn.on;
    ear.classList.toggle("on", wakeOn.on);
    if (wakeOn.on) startWake();
    else { stopWakeChunk(); ear.classList.remove("on"); setMode(""); }
  });

  function chime() {
    try {
      const ac = eyeAudioCtx();
      if (!ac) return;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      const at = ac.currentTime + 0.02;
      osc.type = "sine";
      osc.frequency.setValueAtTime(740, at);
      osc.frequency.setValueAtTime(980, at + 0.075);
      gain.gain.setValueAtTime(0.001, at);
      gain.gain.exponentialRampToValueAtTime(0.07, at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, at + 0.18);
      osc.connect(gain).connect(ac.destination);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      osc.start(at);
      osc.stop(at + 0.19);
    } catch { /* optional */ }
  }

  const WAKE_WORDS = new Set(["capri", "capry", "caprie", "caprea", "copri", "kepri", "caprice", "gabri", "kapri"]);
  function editDistance(a, b) {
    const m = a.length, n = b.length;
    const row = new Array(n + 1);
    for (let j = 0; j <= n; j++) row[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = row[0];
      row[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return row[n];
  }
  function isWakePhrase(text) {
    const clean = String(text || "").toLowerCase().replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
    if (!clean || /\bcapricorn\b/.test(clean)) return false;
    const tokens = clean.split(" ");
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i].replace(/^'+|'+$/g, "");
      if (!token) continue;
      if (WAKE_WORDS.has(token)) return true;
      if (token === "cap" && ["ri", "ree", "ry", "rie"].includes(tokens[i + 1])) return true;
      if (token.length >= 4 && token.length <= 7 && editDistance(token, "capri") <= 1) return true;
    }
    return false;
  }
  function wakeRemainder(text) {
    const tokens = String(text || "").trim().split(/\s+/);
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i].toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
      if (!token) continue;
      let consumed = 1;
      let hit = WAKE_WORDS.has(token);
      if (!hit && token === "cap") {
        const next = (tokens[i + 1] || "").toLowerCase().replace(/[^a-z]/g, "");
        if (/^(ri|ree|ry|rie)$/.test(next)) { hit = true; consumed = 2; }
      }
      if (!hit && token.length >= 4 && token.length <= 7 && editDistance(token, "capri") <= 1) hit = true;
      if (hit) return tokens.slice(i + consumed).join(" ").replace(/^[\s,.;:!?-]+/, "").trim();
    }
    return "";
  }

  // The eye window may open while the mic is in use by Capri's window; retry
  // a moment later instead of giving up for good.
  setTimeout(() => { if (wakeOn.on && state.live) startWake(); }, 1500);
</script>
</body>
</html>
