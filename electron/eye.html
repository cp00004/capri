<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Capri</title>
<style>
  :root { --mint: #4dff9d; --pink: #ff4fd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 12px/1.35 "Segoe UI", system-ui, sans-serif; color: #eaf6ff; }

  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }

  #trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  #stage {
    position: relative;
    z-index: 2;
    margin-top: 26px;
    cursor: grab;
    filter: drop-shadow(0 0 14px rgba(77, 255, 157, .45)) drop-shadow(0 0 34px rgba(255, 79, 216, .22));
    transition: filter .25s ease;
    will-change: transform;
    touch-action: none;
  }
  #stage.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 0 18px rgba(255, 79, 216, .85)) drop-shadow(0 0 40px rgba(77, 255, 157, .5));
  }
  #stage.busy { filter: drop-shadow(0 0 22px rgba(255, 79, 216, .7)); }

  #face { position: relative; will-change: transform; transform-origin: 50% 55%; }
  #eye { display: block; width: 250px; height: auto; }

  /* The eyeball: the iris disc itself, masked soft at the rim, sliding the
     same art inside it so the pupil follows the cursor. */
  #aperture {
    position: absolute;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 66%, rgba(0, 0, 0, 0) 100%);
    mask-image: radial-gradient(circle at 50% 50%, #000 66%, rgba(0, 0, 0, 0) 100%);
  }
  #aperture::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 9px rgba(0, 0, 0, .6), inset 0 0 2px rgba(0, 0, 0, .8);
  }
  #iris {
    position: absolute;
    display: block;
    will-change: transform;
  }

  #scan {
    position: absolute; left: 8%; right: 8%; height: 16px; top: 20%;
    background: linear-gradient(180deg, transparent 0%, rgba(77,255,157,.32) 50%, transparent 100%);
    animation: scan 3.4s linear infinite;
    mix-blend-mode: screen;
    opacity: .8;
    pointer-events: none;
  }
  @keyframes scan { from { top: 16%; } to { top: 84%; } }

  #bubble {
    position: absolute; left: 6px; right: 6px; bottom: 4px;
    max-height: 112px; overflow: hidden;
    padding: 8px 10px;
    background: rgba(7, 0, 12, .93);
    border: 1px solid rgba(77, 255, 157, .55);
    border-left: 2px solid var(--pink);
    box-shadow: 0 0 22px rgba(77, 255, 157, .18);
    opacity: 0; translate: 0 8px;
    transition: opacity .25s ease, translate .25s ease;
    pointer-events: none;
    z-index: 4;
  }
  #bubble.show { opacity: 1; translate: 0 0; }
  #bubble b { display: block; font-size: 9px; letter-spacing: 2px; color: var(--mint); margin-bottom: 3px; }
  #bubble b i { font-style: normal; color: var(--pink); }

  #controls {
    position: absolute; top: 2px; left: 50%; translate: -50% 0;
    display: flex; gap: 5px; opacity: .35; transition: opacity .18s ease;
    z-index: 6; pointer-events: auto;
  }
  #wrap:hover #controls, #controls:hover { opacity: 1; }
  #controls button {
    height: 22px; padding: 0 8px;
    background: rgba(7, 0, 12, .88); color: var(--mint);
    border: 1px solid rgba(77, 255, 157, .5);
    font: 10px/20px system-ui; letter-spacing: 1px; cursor: pointer;
    pointer-events: auto;
  }
  #controls button:hover { background: rgba(77, 255, 157, .22); color: #b6ffe0; }
  #controls button.on { color: #07000c; background: var(--mint); }
  #controls button.rec { color: #07000c; background: var(--pink); border-color: var(--pink); }
  #mic { min-width: 44px; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="trail"></canvas>
    <div id="stage">
      <div id="face">
        <img id="eye" alt="Capri eye" />
        <div id="aperture"><img id="iris" alt="" /></div>
      </div>
      <div id="scan"></div>
    </div>
    <div id="controls">
      <button id="mic" title="Talk to Capri">MIC</button>
      <button id="ear" title="Listen for the wake word">EAR</button>
      <button id="pin" title="Pin in place">PIN</button>
      <button id="close" title="Hide the eye">X</button>
    </div>
    <div id="bubble"><b>CAPRI // EYE <i id="mode"></i></b><span id="line"></span></div>
  </div>

<script>
  const wrap = document.getElementById("wrap");
  const stage = document.getElementById("stage");
  const face = document.getElementById("face");
  const img = document.getElementById("eye");
  const aperture = document.getElementById("aperture");
  const iris = document.getElementById("iris");
  const bubble = document.getElementById("bubble");
  const line = document.getElementById("line");
  const modeTag = document.getElementById("mode");
  const pin = document.getElementById("pin");
  const close = document.getElementById("close");
  const mic = document.getElementById("mic");
  const ear = document.getElementById("ear");
  const canvas = document.getElementById("trail");
  const ctx = canvas.getContext("2d");

  const wakeOn = { on: true };
  const cfg = { base: "", token: "", session: "" };
  const state = { locked: false, bubbleTimer: null, askTimer: null, live: true, dragging: false };

  /* ---------------------------------------------------------- eye cutout */

  const sprite = { image: null, w: 250, h: 160, pink: null, mint: null };
  // Measured off the cutout: the iris disc centre and radius as fractions of
  // the art box. Detection of "blue pixels" caught the blue shadows in the
  // lashes too, which is why the aperture used to grow into a black disc.
  const ball = { cx: 0.4817, cy: 0.604, r: 0.0978, size: 49, left: 0, top: 0, max: 5 };

  // The art came on a white card. Fade every near-white pixel out and trim the
  // empty border, so only the eye is left floating.
  function cutWhite(image) {
    const scale = Math.min(1, 760 / image.naturalWidth);
    const w = Math.max(1, Math.round(image.naturalWidth * scale));
    const h = Math.max(1, Math.round(image.naturalHeight * scale));
    const work = document.createElement("canvas");
    work.width = w;
    work.height = h;
    const c = work.getContext("2d");
    c.drawImage(image, 0, 0, w, h);
    const frame = c.getImageData(0, 0, w, h);
    const px = frame.data;
    for (let i = 0; i < px.length; i += 4) {
      const low = Math.min(px[i], px[i + 1], px[i + 2]);
      const t = Math.min(1, Math.max(0, (low - 150) / 45));
      if (t > 0) px[i + 3] = Math.round(px[i + 3] * (1 - t));
    }
    c.putImageData(frame, 0, 0);

    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (px[(y * w + x) * 4 + 3] > 12) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    const pad = 6;
    let cut = work;
    if (x1 >= x0 && y1 >= y0) {
      x0 = Math.max(0, x0 - pad);
      y0 = Math.max(0, y0 - pad);
      x1 = Math.min(w - 1, x1 + pad);
      y1 = Math.min(h - 1, y1 + pad);
      cut = document.createElement("canvas");
      cut.width = x1 - x0 + 1;
      cut.height = y1 - y0 + 1;
      cut.getContext("2d").drawImage(work, x0, y0, cut.width, cut.height, 0, 0, cut.width, cut.height);
    }

    img.dataset.src = cut.toDataURL("image/png");
    img.src = img.dataset.src;
    sprite.image = img;
    buildEyeball();
    sprite.pink = tint(cut, "#ff4fd8");
    sprite.mint = tint(cut, "#4dff9d");
  }

  function tint(source, color) {
    const out = document.createElement("canvas");
    out.width = source.width;
    out.height = source.height;
    const c = out.getContext("2d");
    c.drawImage(source, 0, 0);
    c.globalCompositeOperation = "source-in";
    c.fillStyle = color;
    c.fillRect(0, 0, out.width, out.height);
    return out;
  }

  // The iris layer is the same cutout parked over itself inside a soft circle.
  // Sliding that layer a few pixels is what makes the eyeball look around.
  function buildEyeball() {
    iris.src = img.dataset.src || img.src;
    layoutEyeball();
  }

  function layoutEyeball() {
    const rect = img.getBoundingClientRect();
    const shownW = rect.width || sprite.w;
    const shownH = rect.height || Math.round(shownW * (sprite.h / sprite.w));
    const size = Math.round(ball.r * 2 * shownW);
    ball.size = size;
    ball.left = ball.cx * shownW - size / 2;
    ball.top = ball.cy * shownH - size / 2;
    ball.max = Math.max(3.4, size * 0.095);
    aperture.style.width = `${size}px`;
    aperture.style.height = `${size}px`;
    aperture.style.left = `${ball.left.toFixed(1)}px`;
    aperture.style.top = `${ball.top.toFixed(1)}px`;
    iris.style.width = `${shownW}px`;
    iris.style.height = `${shownH}px`;
    iris.style.left = `${(-ball.left).toFixed(1)}px`;
    iris.style.top = `${(-ball.top).toFixed(1)}px`;
  }

  img.addEventListener("load", () => {
    sprite.w = 250;
    sprite.h = Math.max(1, Math.round(250 * img.naturalHeight / img.naturalWidth));
    sprite.image = img;
    if (!img.dataset.done) {
      img.dataset.done = "1";
      cutWhite(img);
    } else {
      layoutEyeball();
    }
  });
  img.src = "../public/assets/eye-spy.png";

  /* ------------------------------------------------------ self-movement */

  // The whole eye drifts on its own; the eyeball inside it aims at the cursor.
  const gaze = { x: 0, y: 0, rot: 0, tx: 0, ty: 0, trot: 0, next: 0 };
  const look = { x: 0, y: 0, tx: 0, ty: 0, next: 0 };
  const impulse = { x: 0, y: 0 };
  let cursor = null;
  let lastCursorAt = 0;
  const ghosts = [];
  let lastStamp = { x: 0, y: 0, rot: 0 };
  let ghostColor = 0;

  function newGazeTarget() {
    const spread = Math.random() > 0.85 ? 12 : 7;
    gaze.tx = (Math.random() * 2 - 1) * spread;
    gaze.ty = (Math.random() * 2 - 1) * 5;
    gaze.trot = (Math.random() * 2 - 1) * 2.6;
    gaze.next = performance.now() + 2200 + Math.random() * 3000;
  }
  function newLookTarget() {
    const angle = Math.random() * Math.PI * 2;
    look.tx = Math.cos(angle) * ball.max;
    look.ty = Math.sin(angle) * ball.max * 0.7;
    look.next = performance.now() + 1200 + Math.random() * 2200;
  }
  newGazeTarget();
  newLookTarget();

  function stageBox() { return stage.getBoundingClientRect(); }

  function frame(now) {
    const box = stageBox();
    const cx = window.innerWidth / 2;
    const cy = box.top + box.height / 2;

    if (now > gaze.next) newGazeTarget();

    let tx = gaze.tx;
    let ty = gaze.ty;
    let trot = gaze.trot;

    // Lean the whole eye toward the cursor when it is moving around this window.
    if (cursor && now - lastCursorAt < 2600 && !state.locked) {
      const dx = Math.max(-1, Math.min(1, (cursor.x - cx) / (box.width * 1.4)));
      const dy = Math.max(-1, Math.min(1, (cursor.y - cy) / (box.height * 7)));
      tx = tx * 0.35 + dx * 10;
      ty = ty * 0.35 + dy * 5;
      trot = trot * 0.4 + dx * 2;
    }

    gaze.x += (tx - gaze.x) * 0.055;
    gaze.y += (ty - gaze.y) * 0.055;
    gaze.rot += (trot - gaze.rot) * 0.06;

    impulse.x *= 0.9;
    impulse.y *= 0.9;

    const px = gaze.x + impulse.x;
    const py = gaze.y + impulse.y;
    stage.style.transform = `translate(${px.toFixed(2)}px, ${py.toFixed(2)}px) rotate(${gaze.rot.toFixed(2)}deg)`;

    /* ---- eyeball: follow the cursor, wander when it is far away ---- */
    const irisLeft = box.left + ball.left + px + ball.size / 2;
    const irisTop = box.top + ball.top + py + ball.size / 2;
    if (cursor && now - lastCursorAt < 4000) {
      const dx = cursor.x - irisLeft;
      const dy = cursor.y - irisTop;
      const dist = Math.hypot(dx, dy);
      if (dist > ball.size * 0.55) {
        look.tx = (dx / dist) * ball.max;
        look.ty = (dy / dist) * ball.max * 0.85;
      } else {
        look.tx = (dx / ball.size) * ball.max;
        look.ty = (dy / ball.size) * ball.max;
      }
      look.next = now + 900;
    } else if (now > look.next) {
      newLookTarget();
    }
    look.x += (look.tx - look.x) * 0.12;
    look.y += (look.ty - look.y) * 0.12;
    iris.style.transform = `translate(${look.x.toFixed(2)}px, ${look.y.toFixed(2)}px)`;

    const ox = cx + px;
    const oy = cy + py;
    const step = state.dragging ? 2.2 : 1.2;
    const seam = state.dragging ? 5 : 11;
    if (Math.hypot(ox - lastStamp.x, oy - lastStamp.y) > step) {
      ghosts.push({ x: ox, y: oy, rot: gaze.rot, life: 1, color: state.dragging ? (ghostColor++ % 2 ? "pink" : "mint") : "" });
      if (ghosts.length > seam) ghosts.shift();
      lastStamp = { x: ox, y: oy };
    }

    drawTrail();
    requestAnimationFrame(frame);
  }

  function drawTrail() {
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(window.innerWidth * dpr)) {
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!sprite.image || !sprite.image.complete || !sprite.image.naturalWidth) return;
    if (!sprite.w) return;

    for (let i = ghosts.length - 1; i >= 0; i--) {
      const g = ghosts[i];
      g.life *= g.color ? 0.9 : 0.86;
      if (g.life < 0.06) { ghosts.splice(i, 1); continue; }
      const art = g.color === "pink" ? sprite.pink : g.color === "mint" ? sprite.mint : sprite.image;
      if (!art) continue;
      ctx.save();
      ctx.globalAlpha = (g.color ? 0.34 : 0.13) * g.life * g.life;
      ctx.translate(g.x, g.y);
      ctx.rotate((g.rot * Math.PI) / 180);
      ctx.drawImage(art, -sprite.w / 2, -sprite.h / 2, sprite.w, sprite.h);
      ctx.restore();
    }
  }

  requestAnimationFrame(frame);

  window.capriEye?.onCursor((point) => {
    cursor = point;
    lastCursorAt = performance.now();
  });

  // Dragging leaves the eye behind for a frame, which reads as a streak.
  window.capriEye?.onMove(({ dx, dy }) => {
    if (!dx && !dy) return;
    impulse.x = Math.max(-26, Math.min(26, impulse.x - dx * 0.55));
    impulse.y = Math.max(-18, Math.min(18, impulse.y - dy * 0.55));
  });

  /* ------------------------------------------------------------- drag */

  // The window is moved from here in screen coordinates. Native drag regions
  // were swallowing the mouse: they cannot coexist with the per-frame transforms
  // on the stage, and they made the controls unclickable.
  const drag = { on: false, lx: 0, ly: 0, moved: 0, id: null };

  function endDrag() {
    if (!drag.on) return;
    drag.on = false;
    state.dragging = false;
    stage.classList.remove("dragging");
    if (drag.id !== null) { try { stage.releasePointerCapture(drag.id); } catch { /* gone */ } }
    drag.id = null;
    window.capriEye?.dragEnd();
    if (drag.moved < 6) setMode("");
  }

  stage.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    if (event.target.closest("button")) return;
    drag.on = true;
    drag.lx = event.screenX;
    drag.ly = event.screenY;
    drag.moved = 0;
    drag.id = event.pointerId;
    state.dragging = true;
    stage.classList.add("dragging");
    setMode("hold");
    try { stage.setPointerCapture(event.pointerId); } catch { /* not capturable */ }
    event.preventDefault();
  });

  stage.addEventListener("pointermove", (event) => {
    if (!drag.on) return;
    const dx = event.screenX - drag.lx;
    const dy = event.screenY - drag.ly;
    if (!dx && !dy) return;
    drag.lx = event.screenX;
    drag.ly = event.screenY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    window.capriEye?.drag(dx, dy);
  });

  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("lostpointercapture", endDrag);

  /* ------------------------------------------------------------- blink */

  function blink() {
    face.animate(
      [{ transform: "scaleY(1)" }, { transform: "scaleY(0.08)" }, { transform: "scaleY(1)" }],
      { duration: 190, easing: "ease-in-out" }
    );
  }
  (function scheduleBlink() {
    setTimeout(() => { blink(); if (Math.random() > 0.7) setTimeout(blink, 240); scheduleBlink(); }, 3200 + Math.random() * 5200);
  })();

  /* ------------------------------------------------------------- speech */

  function setMode(text) { modeTag.textContent = text ? `// ${text}` : ""; }

  window.capriEye?.onSay(({ text }) => {
    if (!text) { bubble.classList.remove("show"); return; }
    line.textContent = text;
    bubble.classList.add("show");
    stage.classList.add("busy");
    setMode("");
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => {
      bubble.classList.remove("show");
      stage.classList.remove("busy");
    }, 11000);
  });

  window.capriEye?.onConfig((data) => {
    Object.assign(cfg, data || {});
    if (state.live && wakeOn.on) wakeRec.on ? null : startWake();
  });

  // Hidden eye means no mic: stop listening the moment the overlay goes away.
  window.capriEye?.onLive((live) => {
    state.live = Boolean(live);
    if (!state.live) {
      stopWakeChunk();
      if (talk.active) stopTalk();
    } else {
      ghosts.length = 0;
      lastStamp = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      if (wakeOn.on) setTimeout(startWake, 400);
    }
  });

  window.capriEye?.onPinned((locked) => {
    state.locked = Boolean(locked);
    pin.classList.toggle("on", state.locked);
    pin.textContent = state.locked ? "PINNED" : "PIN";
  });

  pin.addEventListener("click", () => window.capriEye?.setPinned(!state.locked));
  close.addEventListener("click", () => window.capriEye?.hide());

  /* -------------------------------------------------------------- voice */

  const MIMES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  function pickMime() {
    if (typeof MediaRecorder === "undefined") return "";
    return MIMES.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  }

  const talk = { active: false, chunks: [], recorder: null, stream: null, stopTimer: null, heard: false };
  const wakeRec = { on: false, chunks: [], recorder: null, stream: null, timer: null, busy: false, ctx: null, heard: false };

  async function ask(text) {
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    if (!clean) return;
    setMode("heard");
    line.textContent = clean;
    bubble.classList.add("show");
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 8000);
    window.capriEye?.ask(clean);
    stage.classList.add("busy");
    clearTimeout(state.askTimer);
    state.askTimer = setTimeout(() => { stage.classList.remove("busy"); setMode(""); }, 20000);
  }

  async function transcribe(blob) {
    if (!cfg.base) return "";
    const headers = { "Content-Type": blob.type || "audio/webm" };
    if (cfg.token) headers.Authorization = `Bearer ${cfg.token}`;
    if (cfg.session) headers["X-Capri-Profile"] = cfg.session;
    try {
      const res = await fetch(`${cfg.base}/api/stt`, { method: "POST", headers, body: blob });
      if (!res.ok) return "";
      const data = await res.json().catch(() => ({}));
      return String(data.text || "").trim();
    } catch {
      return "";
    }
  }

  async function startTalk() {
    if (talk.active) return stopTalk();
    if (typeof MediaRecorder === "undefined") { setMode("no mic"); return; }
    stopWakeChunk();
    try {
      talk.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch {
      setMode("mic blocked");
      return;
    }
    const mime = pickMime();
    talk.chunks = [];
    talk.recorder = mime ? new MediaRecorder(talk.stream, { mimeType: mime }) : new MediaRecorder(talk.stream);
    talk.recorder.ondataavailable = (e) => { if (e.data && e.data.size) talk.chunks.push(e.data); };
    talk.recorder.onstop = async () => {
      const blob = new Blob(talk.chunks, { type: talk.recorder.mimeType || "audio/webm" });
      talk.stream?.getTracks().forEach((t) => t.stop());
      talk.stream = null;
      talk.active = false;
      mic.classList.remove("rec");
      mic.textContent = "MIC";
      setMode("");
      if (blob.size < 2000) return;
      setMode("thinking");
      const text = await transcribe(blob);
      if (!text) { setMode("heard noise"); setTimeout(() => setMode(""), 2500); return; }
      ask(text);
      resumeWake();
    };
    talk.recorder.start(120);
    talk.active = true;
    mic.classList.add("rec");
    mic.textContent = "STOP";
    setMode("listening");
    clearTimeout(talk.stopTimer);
    talk.stopTimer = setTimeout(() => stopTalk(), 16000);
  }

  function stopTalk() {
    clearTimeout(talk.stopTimer);
    if (!talk.active || !talk.recorder || talk.recorder.state === "inactive") return;
    try { talk.recorder.stop(); } catch { /* already stopped */ }
  }

  mic.addEventListener("click", startTalk);

  /* Wake word: recorded in short clips while the eye is up, read by her own
     /api/stt, so "Capri ..." works even when Capri's window is away. */
  async function startWake() {
    if (!wakeOn.on || wakeRec.on || talk.active || !state.live) return;
    if (typeof MediaRecorder === "undefined" || !cfg.base) return;
    try {
      wakeRec.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch {
      wakeOn.on = false;
      ear.classList.remove("on");
      setMode("mic blocked");
      return;
    }
    const mime = pickMime();
    wakeRec.chunks = [];
    wakeRec.heard = false;
    wakeRec.recorder = mime ? new MediaRecorder(wakeRec.stream, { mimeType: mime }) : new MediaRecorder(wakeRec.stream);
    wakeRec.recorder.ondataavailable = (e) => { if (e.data && e.data.size) wakeRec.chunks.push(e.data); };
    wakeRec.recorder.start(120);
    wakeRec.on = true;
    ear.classList.add("on");
    setMode("ear on");
    // Silence costs nothing: only a clip with a voice in it is sent to her.
    try {
      wakeRec.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = wakeRec.ctx.createMediaStreamSource(wakeRec.stream);
      const analyser = wakeRec.ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.fftSize);
      const watch = setInterval(() => {
        if (!wakeRec.on || !wakeRec.stream) { clearInterval(watch); return; }
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        if (Math.sqrt(sum / buf.length) > 0.025) wakeRec.heard = true;
      }, 120);
    } catch { wakeRec.heard = true; }
    clearTimeout(wakeRec.timer);
    wakeRec.timer = setTimeout(stopWakeChunk, 3600);
  }

  function stopWakeChunk() {
    clearTimeout(wakeRec.timer);
    wakeRec.on = false;
    const rec = wakeRec.recorder;
    if (!rec || rec.state === "inactive") return;
    rec.onstop = async () => {
      const blob = new Blob(wakeRec.chunks, { type: rec.mimeType || "audio/webm" });
      wakeRec.stream?.getTracks().forEach((t) => t.stop());
      wakeRec.stream = null;
      wakeRec.chunks = [];
      wakeRec.busy = false;
      try { wakeRec.ctx?.close().catch(() => {}); } catch { /* already closed */ }
      wakeRec.ctx = null;
      if (blob.size > 1200 && wakeRec.heard) {
        const text = await transcribe(blob);
        if (text && isWakePhrase(text)) {
          const rest = wakeRemainder(text);
          chime();
          if (rest.split(/\s+/).filter(Boolean).length >= 2) ask(rest);
          else { setTimeout(startTalk, 250); return; }
        }
      }
      if (!talk.active && wakeOn.on && state.live) setTimeout(startWake, 320);
    };
    try { rec.stop(); } catch { /* already stopped */ }
  }

  function resumeWake() {
    if (wakeOn.on && !talk.active && !wakeRec.on) setTimeout(startWake, 500);
  }

  ear.addEventListener("click", () => {
    wakeOn.on = !wakeOn.on;
    ear.classList.toggle("on", wakeOn.on);
    if (wakeOn.on) startWake();
    else { stopWakeChunk(); ear.classList.remove("on"); setMode(""); }
  });

  function chime() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ac = new Ctx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(740, ac.currentTime);
      osc.frequency.setValueAtTime(980, ac.currentTime + 0.075);
      gain.gain.setValueAtTime(0.001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.07, ac.currentTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      osc.connect(gain).connect(ac.destination);
      osc.onended = () => ac.close().catch(() => {});
      osc.start();
      osc.stop(ac.currentTime + 0.19);
    } catch { /* optional */ }
  }

  const WAKE_WORDS = new Set(["capri", "capry", "caprie", "caprea", "copri", "kepri", "caprice", "gabri", "kapri"]);
  function editDistance(a, b) {
    const m = a.length, n = b.length;
    const row = new Array(n + 1);
    for (let j = 0; j <= n; j++) row[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = row[0];
      row[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return row[n];
  }
  function isWakePhrase(text) {
    const clean = String(text || "").toLowerCase().replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
    if (!clean || /\bcapricorn\b/.test(clean)) return false;
    const tokens = clean.split(" ");
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i].replace(/^'+|'+$/g, "");
      if (!token) continue;
      if (WAKE_WORDS.has(token)) return true;
      if (token === "cap" && ["ri", "ree", "ry", "rie"].includes(tokens[i + 1])) return true;
      if (token.length >= 4 && token.length <= 7 && editDistance(token, "capri") <= 1) return true;
    }
    return false;
  }
  function wakeRemainder(text) {
    const tokens = String(text || "").trim().split(/\s+/);
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i].toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
      if (!token) continue;
      let consumed = 1;
      let hit = WAKE_WORDS.has(token);
      if (!hit && token === "cap") {
        const next = (tokens[i + 1] || "").toLowerCase().replace(/[^a-z]/g, "");
        if (/^(ri|ree|ry|rie)$/.test(next)) { hit = true; consumed = 2; }
      }
      if (!hit && token.length >= 4 && token.length <= 7 && editDistance(token, "capri") <= 1) hit = true;
      if (hit) return tokens.slice(i + consumed).join(" ").replace(/^[\s,.;:!?-]+/, "").trim();
    }
    return "";
  }

  // The eye window may open while the mic is in use by Capri's window; retry
  // a moment later instead of giving up for good.
  setTimeout(() => { if (wakeOn.on && state.live) startWake(); }, 1500);
</script>
