<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Capri eye</title>
<style>
  :root { --mint: #4dff9d; --pink: #ff4fd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 12px/1.35 "Segoe UI", system-ui, sans-serif; color: #eaf6ff; }

  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 10px;
  }

  #drag {
    -webkit-app-region: drag;
    position: relative;
    cursor: grab;
    filter: drop-shadow(0 0 14px rgba(77, 255, 157, .45)) drop-shadow(0 0 34px rgba(255, 79, 216, .22));
    transition: filter .3s ease;
  }
  #drag.locked { cursor: default; -webkit-app-region: no-drag; }
  #drag.busy { filter: drop-shadow(0 0 22px rgba(255, 79, 216, .7)); }

  #eye { display: block; width: 260px; height: auto; animation: float 6s ease-in-out infinite; will-change: transform; }
  #drag.blink #eye { animation: float 6s ease-in-out infinite, blink 4.6s ease-in-out infinite; }

  @keyframes float {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -5px; }
  }
  @keyframes blink {
    0%, 92%, 100% { scale: 1 1; }
    94% { scale: 1 .12; }
    96% { scale: 1 .12; }
  }

  #scan {
    position: absolute; left: 8%; right: 8%; height: 16px; top: 20%;
    background: linear-gradient(180deg, transparent 0%, rgba(77,255,157,.32) 50%, transparent 100%);
    animation: scan 3.4s linear infinite;
    mix-blend-mode: screen;
    opacity: .8;
    pointer-events: none;
  }
  @keyframes scan { from { top: 16%; } to { top: 84%; } }

  #spark {
    position: absolute; left: 50%; top: 42%;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff4fd8 0%, rgba(255,79,216,0) 70%);
    opacity: 0;
    animation: spark 5.5s ease-in-out infinite;
    pointer-events: none; mix-blend-mode: screen;
  }
  @keyframes spark {
    0%, 80%, 100% { opacity: 0; scale: .6; }
    85% { opacity: .9; scale: 1.6; }
    92% { opacity: .3; scale: 2.4; }
  }

  #bubble {
    position: absolute; left: 6px; right: 6px; bottom: 4px;
    max-height: 108px; overflow: hidden;
    padding: 8px 10px;
    background: rgba(7, 0, 12, .93);
    border: 1px solid rgba(77, 255, 157, .55);
    border-left: 2px solid var(--pink);
    box-shadow: 0 0 22px rgba(77, 255, 157, .18);
    opacity: 0; translate: 0 8px;
    transition: opacity .25s ease, translate .25s ease;
    pointer-events: none;
  }
  #bubble.show { opacity: 1; translate: 0 0; }
  #bubble b { display: block; font-size: 9px; letter-spacing: 2px; color: var(--mint); margin-bottom: 3px; }

  #controls {
    position: absolute; top: 0; left: 50%; translate: -50% 0;
    display: flex; gap: 4px; opacity: 0; transition: opacity .2s ease;
    -webkit-app-region: no-drag; z-index: 3;
  }
  #wrap:hover #controls { opacity: 1; }
  #controls button {
    -webkit-app-region: no-drag;
    height: 20px; padding: 0 6px;
    background: rgba(7, 0, 12, .85); color: var(--mint);
    border: 1px solid rgba(77, 255, 157, .5);
    font: 10px/18px system-ui; letter-spacing: 1px; cursor: pointer;
  }
  #controls button:hover { background: rgba(77, 255, 157, .18); }
  #controls button.on { color: #07000c; background: var(--mint); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="controls">
      <button id="pin" title="Pin in place">PIN</button>
      <button id="close" title="Hide the eye">X</button>
    </div>
    <div id="drag">
      <img id="eye" alt="Capri eye" />
      <div id="scan"></div>
      <div id="spark"></div>
    </div>
    <div id="bubble"><b>CAPRI // EYE</b><span id="line"></span></div>
  </div>

<script>
  const drag = document.getElementById("drag");
  const img = document.getElementById("eye");
  const bubble = document.getElementById("bubble");
  const line = document.getElementById("line");
  const pin = document.getElementById("pin");
  const close = document.getElementById("close");

  // The art came on a white card. Fade every near-white pixel out and trim the
  // empty border, so only the eye is left floating.
  function cutWhite(image) {
    const scale = Math.min(1, 720 / image.naturalWidth);
    const w = Math.max(1, Math.round(image.naturalWidth * scale));
    const h = Math.max(1, Math.round(image.naturalHeight * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(image, 0, 0, w, h);
    const frame = ctx.getImageData(0, 0, w, h);
    const px = frame.data;
    for (let i = 0; i < px.length; i += 4) {
      const low = Math.min(px[i], px[i + 1], px[i + 2]);
      const t = Math.min(1, Math.max(0, (low - 150) / 45));
      if (t > 0) px[i + 3] = Math.round(px[i + 3] * (1 - t));
    }
    ctx.putImageData(frame, 0, 0);

    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (px[(y * w + x) * 4 + 3] > 12) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < x0 || y1 < y0) { img.src = canvas.toDataURL("image/png"); return; }
    const pad = 6;
    x0 = Math.max(0, x0 - pad);
    y0 = Math.max(0, y0 - pad);
    x1 = Math.min(w - 1, x1 + pad);
    y1 = Math.min(h - 1, y1 + pad);
    const out = document.createElement("canvas");
    out.width = x1 - x0 + 1;
    out.height = y1 - y0 + 1;
    out.getContext("2d").drawImage(canvas, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    img.src = out.toDataURL("image/png");
  }

  img.addEventListener("load", () => {
    if (img.dataset.done) return;
    img.dataset.done = "1";
    cutWhite(img);
  });
  img.src = "../public/assets/eye-spy.png";

  const state = { locked: false, bubbleTimer: null };
  let last = { x: 0, y: 0 };
  let raf = 0;

  function follow() {
    raf = 0;
    if (state.locked) { drag.style.transform = ""; return; }
    const rect = drag.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = Math.max(-1, Math.min(1, (last.x - cx) / (rect.width * 1.6)));
    const dy = Math.max(-1, Math.min(1, (last.y - cy) / (rect.height * 9)));
    drag.style.transform = `translate(${(dx * 9).toFixed(1)}px, ${(dy * 5).toFixed(1)}px) rotate(${(dx * 1.6).toFixed(2)}deg)`;
  }
  window.capriEye?.onCursor((point) => {
    last = point;
    if (!raf) raf = requestAnimationFrame(follow);
  });

  window.capriEye?.onSay(({ text, sticky }) => {
    if (!text) { bubble.classList.remove("show"); return; }
    line.textContent = text;
    bubble.classList.add("show");
    drag.classList.add("busy");
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => {
      bubble.classList.remove("show");
      drag.classList.remove("busy");
    }, sticky ? 16000 : 11000);
  });

  window.capriEye?.onPinned((locked) => {
    state.locked = Boolean(locked);
    drag.classList.toggle("locked", state.locked);
    pin.classList.toggle("on", state.locked);
    pin.textContent = state.locked ? "PINNED" : "PIN";
    if (state.locked) drag.style.transform = "";
  });

  pin.addEventListener("click", () => window.capriEye?.setPinned(!state.locked));
  close.addEventListener("click", () => window.capriEye?.hide());

  setInterval(() => {
    drag.classList.add("blink");
    setTimeout(() => drag.classList.remove("blink"), 700);
  }, 7000 + Math.random() * 5000);
</script>
</body>
</html>
