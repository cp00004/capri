<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Capri warp</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="warp"></canvas>
<script>
  const canvas = document.getElementById("warp");
  const ctx = canvas.getContext("2d");
  const COLORS = ["#ff2b45", "#05000a", "#31ff8a", "#ff4fd8", "#4dff9d"];
  const parts = [];
  const bands = [];
  let W = 0;
  let H = 0;

  function size() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function burst() {
    size();
    for (let i = 0; i < 90; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.6 + Math.random() * 4.4;
      parts.push({
        x: W / 2 + (Math.random() - 0.5) * 60,
        y: H / 2 + (Math.random() - 0.5) * 40,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.7,
        life: 1,
        w: 2 + Math.random() * 9,
        h: 1 + Math.random() * 4,
        color: COLORS[(Math.random() * COLORS.length) | 0],
      });
    }
    for (let i = 0; i < 7; i++) {
      bands.push({ y: Math.random() * H, h: 1 + Math.random() * 5, life: 1, drift: (Math.random() - 0.5) * 6 });
    }
  }

  const started = performance.now();
  burst();

  function frame(now) {
    const t = now - started;
    ctx.clearRect(0, 0, W, H);

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= 0.026;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 0.03;
      ctx.globalAlpha = Math.min(1, p.life) * 0.95;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }

    for (let i = bands.length - 1; i >= 0; i--) {
      const b = bands[i];
      b.life -= 0.035;
      if (b.life <= 0) { bands.splice(i, 1); continue; }
      b.y += b.drift;
      ctx.globalAlpha = b.life * 0.5;
      ctx.fillStyle = i % 2 ? "#ff2b45" : "#31ff8a";
      ctx.fillRect(0, b.y, W, b.h);
    }

    ctx.globalAlpha = 1;
    if (t < 1000) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); }
  }

  requestAnimationFrame(frame);
</script>
</body>
</html>
