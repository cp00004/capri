<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07000c" />
<title>CAPRI // link a Google account</title>
<style>
  :root {
    --bg: #07000c;
    --panel: #120013;
    --pink: #ff0b52;
    --mint: #6dffbe;
    --ink: #e6dbe4;
    --ink-dim: #a98fa4;
    --line: #3a0a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255, 11, 82, .18), transparent 60%),
      radial-gradient(90% 60% at 90% 110%, rgba(109, 255, 190, .12), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Rajdhani", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(420px, 100%);
    padding: 26px 22px 24px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255, 11, 82, .07), rgba(18, 0, 19, .96) 42%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 11, 82, .06) inset;
    text-align: center;
  }
  .kick {
    font: 600 11px/1.4 "Share Tech Mono", ui-monospace, monospace;
    letter-spacing: .22em;
    color: var(--pink);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: .01em; }
  p { margin: 0 0 18px; font-size: 15px; line-height: 1.45; color: var(--ink-dim); }
  #slot { display: flex; justify-content: center; min-height: 44px; margin-bottom: 14px; }
  #slot.hidden { display: none; }
  .btn {
    width: 100%;
    min-height: 48px;
    padding: 12px 18px;
    border: 1px solid rgba(109, 255, 190, .45);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(109, 255, 190, .16), rgba(109, 255, 190, .04));
    color: var(--mint);
    font: 700 14px/1 "Share Tech Mono", ui-monospace, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn[hidden] { display: none; }
  .btn:active { transform: translateY(1px); }
  .hint {
    margin: 16px 0 0;
    font: 400 12.5px/1.5 "Share Tech Mono", ui-monospace, monospace;
    color: var(--ink-dim);
    word-break: break-word;
  }
  .hint a { color: var(--mint); }
  .ok { color: var(--mint); }
  .bad { color: #ff6b8f; }
</style>
</head>
<body>
  <main class="card">
    <div class="kick">capri // account link</div>
    <h1 id="title">Choose your Google account</h1>
    <p id="sub">Capri keeps your memory, preferences and history under this account. Pick the one you want her to remember.</p>
    <div id="slot"></div>
    <button id="go" class="btn" type="button" hidden>Continue with Google</button>
    <p class="hint" id="hint">Google's account picker opens when you press the button.</p>
    <p class="hint"><a id="altLink" href="https://accounts.google.com/AccountChooser">Don't see your account? Add it in Google</a></p>
  </main>

<script>
  // Public web client id — also baked into the Android manifest. Not a secret.
  var CLIENT_ID = "240583618801-6l8bpgneim3nfker6kbbbj4brt2gjrg2.apps.googleusercontent.com";
  var params = new URLSearchParams(location.search);
  var mode = params.get("mode") === "app" ? "app" : "loop";
  var cb = params.get("cb") || "";
  var done = false;

  // Lets a user add a Google account to this browser, then come straight back.
  document.getElementById("altLink").href =
    "https://accounts.google.com/AccountChooser?continue=" + encodeURIComponent(location.href);

  var titleEl = document.getElementById("title");
  var subEl = document.getElementById("sub");
  var slotEl = document.getElementById("slot");
  var goEl = document.getElementById("go");
  var hintEl = document.getElementById("hint");

  function say(text, cls) {
    hintEl.textContent = text;
    hintEl.className = "hint" + (cls ? " " + cls : "");
  }

  function handoff(credential) {
    if (done) return;
    done = true;
    slotEl.classList.add("hidden");
    goEl.hidden = true;

    if (mode === "app") {
      var link = "capri://auth?credential=" + encodeURIComponent(credential);
      titleEl.textContent = "You're signed in";
      subEl.textContent = "Capri should reopen by itself. If it doesn't, press the button below.";
      goEl.textContent = "Return to Capri";
      goEl.hidden = false;
      goEl.onclick = function () { location.href = link; };
      try { location.href = link; } catch (err) { /* needs a tap on some browsers */ }
      say("Signed in. Close this tab once Capri is back.");
      return;
    }

    if (!cb) {
      titleEl.textContent = "Signed in";
      subEl.textContent = "Google accepted the account, but this page had no way back to the app.";
      say("Reopen Capri and press Continue with Google again.", "bad");
      return;
    }
    titleEl.textContent = "You're signed in";
    subEl.textContent = "Taking you back to Capri…";
    say("If nothing happens, close this tab and reopen Capri.");
    location.replace(cb + (cb.indexOf("?") >= 0 ? "&" : "?") + "credential=" + encodeURIComponent(credential));
  }

  function loadGis() {
    return new Promise(function (resolve) {
      if (window.google && window.google.accounts && window.google.accounts.id) return resolve(true);
      var s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.async = true;
      s.defer = true;
      s.onload = function () { resolve(Boolean(window.google && window.google.accounts && window.google.accounts.id)); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
      setTimeout(function () { resolve(Boolean(window.google && window.google.accounts && window.google.accounts.id)); }, 8000);
    });
  }

  function showManual() {
    // Google's button did not render (origin not registered, offline, in-app browser).
    goEl.textContent = "Continue with Google";
    goEl.hidden = false;
    goEl.onclick = openAccountsPage;
  }

  function openAccountsPage() {
    // Last resort: open Google's own account manager so the user can see which
    // accounts exist, then come back. Does not sign Capri in by itself.
    location.href = "https://accounts.google.com/AccountChooser?continue=" +
      encodeURIComponent("https://cp00004.github.io/capri/auth.html" + location.search);
  }

  loadGis().then(function (ok) {
    if (!ok) {
      titleEl.textContent = "Google is unreachable";
      subEl.textContent = "The sign-in script did not load. Check your connection and reload this page.";
      say("Reload the page to try again.", "bad");
      showManual();
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: function (response) {
          if (response && response.credential) handoff(response.credential);
        },
        auto_select: false,
        cancel_on_tap_outside: true,
        use_fedcm_for_prompt: true,
      });
    } catch (err) {
      say("Google sign-in could not start on this page: " + (err && err.message ? err.message : err), "bad");
      showManual();
      return;
    }

    try {
      google.accounts.id.renderButton(slotEl, {
        type: "standard",
        theme: "filled_black",
        size: "large",
        text: "continue_with",
        shape: "pill",
        width: 280,
      });
    } catch (err) { /* fall through to the manual button */ }

    setTimeout(function () {
      var rendered = Boolean(slotEl.querySelector('div[role="button"], iframe'));
      if (rendered) { say("Pick an account in the Google window."); return; }
      titleEl.textContent = "Google needs this site approved";
      subEl.textContent = "In Google Cloud Console → Credentials → Web OAuth client, add https://cp00004.github.io under Authorized JavaScript origins, then reload.";
      showManual();
    }, 2600);
  });
</script>
</body>
</html>
