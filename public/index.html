<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07000c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Capri" />
<script>
  (function(){
    if (location.hostname.includes('github.io')) {
      var b = document.createElement('base');
      b.href = '/capri/';
      document.head.appendChild(b);
    } else if (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if (!document.querySelector('base')) {
        var b2 = document.createElement('base');
        b2.href = './';
        document.head.appendChild(b2);
      }
    } else if (window.Capacitor) {
      if (!document.querySelector('base')) {
        var b3 = document.createElement('base');
        b3.href = './';
        document.head.appendChild(b3);
      }
    } else {
      if (!document.querySelector('base')) {
        var b4 = document.createElement('base');
        b4.href = './';
        document.head.appendChild(b4);
      }
    }
  })();
</script>
<meta name="mobile-web-app-capable" content="yes" />
<title>CAPRI // Project Capricorn</title>
<link rel="canonical" href="https://cp00004.github.io/capri/" />
<link rel="icon" href="assets/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20261027-1723" />
</head>
<body data-state="idle">
<div id="splash" class="splash">
  <div class="splash-inner">
    <img src="assets/splash.png" alt="Capri" class="splash-logo" onerror="this.src='assets/capri.svg'" />
    <div class="splash-text">CAPRI // PROJECT CAPRICORN</div>
    <div class="splash-bar"><div class="splash-bar-fill" id="splashBar"></div></div>
    <div class="splash-glitch" aria-hidden="true"></div>
  </div>
</div>
<div id="profileBg" class="profile-bg hidden">
  <img src="assets/profile-bg.png" alt="" class="profile-bg-img" />
  <div class="profile-bg-overlay"></div>
  <div class="profile-bg-bar"><div class="profile-bg-bar-fill" id="profileBgBar"></div></div>
</div>
<div class="grain" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<header class="top">
    <button id="downloadBtn" class="icon" type="button" aria-label="Download APK" title="Download APK" data-open="downloadSidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16v-8M8 12l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  <span class="dot" id="stateDot" aria-hidden="true"></span>
  <span class="tag" id="stateTag">online</span>
  <button id="settingsBtn" class="icon" type="button" aria-label="Settings" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h9M4 12h6M4 17h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="17" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="13" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="18" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </svg>
  </button>
</header>

<main class="stage">
  <div class="portrait" id="portraitWrap">
    <div class="hex-glow" aria-hidden="true"></div>
    <div class="hex-frame">
      <div class="hex-inner">
        <img id="portraitImg" src="assets/capri.svg" alt="Capri" />
        <img class="ghost ghost-a" id="ghostA" src="assets/capri.svg" alt="" aria-hidden="true" />
        <img class="ghost ghost-b" id="ghostB" src="assets/capri.svg" alt="" aria-hidden="true" />
        <canvas class="arcs" id="arcCanvas" aria-hidden="true"></canvas>
        <div class="hex-tint" aria-hidden="true"></div>
        <div class="hex-scan" aria-hidden="true"></div>
        <div class="tear" id="tearA" aria-hidden="true"></div>
        <div class="tear" id="tearB" aria-hidden="true"></div>
        <div class="act" id="act" aria-live="polite"></div>
      </div>
    </div>
  </div>
</main>

<footer class="dock">
  <div class="heard" id="heard"></div>
  <div class="subtitle" id="subtitle" aria-live="polite"></div>
  <button id="micBtn" class="mic" type="button" aria-label="Tap to talk">
    <span class="mic-rings" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/>
      <path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="dock-row">
    <button id="kbBtn" class="pill" type="button">KEYBOARD</button>
  </div>
</footer>

<form id="kbForm" class="kb-sheet hidden" autocomplete="off">
  <input id="kbInput" type="text" placeholder="type it, choom..." enterkeyhint="send" />
  <button class="pill" type="submit">SEND</button>
</form>

<!-- ================================================= settings -->
    <!-- Download APK Section -->
    
<!-- ---------------------------------------------------- download sidebar -->
<section id="downloadSidebar" class="sheet hidden">
  <header class="sheet-header">
    <h2>Download APK</h2>
    <button class="icon close-sheet" aria-label="Close" onclick="closeSheet(this.parentElement.parentElement)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="sheet-body">
    <a class="download-link" href="assets/Capri.apk" download>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="download-icon"><path d="M12 3v10M8 9l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Download Capri.apk</span>
    </a>
    <p class="note">If the download does not start, right‑click and choose “Save link as…”.</p>
  </div>
</section>
